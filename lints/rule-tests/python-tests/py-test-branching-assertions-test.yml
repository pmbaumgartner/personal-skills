    def test_apply(table, dry_run):
        if dry_run:
            table.freeze()
        result = apply(table, dry_run=dry_run)
        assert result.ok
  - |
    def test_rows(rows):
        for row in rows:
            if row.kind == "skip":
                continue
            assert row.valid
  - |
    class ApplyTest(TestCase):
        def test_apply(self):
            if self.flag:
                self.assertTrue(apply())

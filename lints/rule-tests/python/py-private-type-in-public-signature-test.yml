id: py-private-type-in-public-signature
valid:
  - "def create_server(cache: Cache) -> None: ..."
  - "def _create_server(cache: _Cache) -> None: ..."
  - "def search(top_k=_DEFAULT_TOP_K) -> list[Result]: ..."
  - |
    class _Cache:
        def get(self, key: _Entry) -> None: ...
  - "def parent(elem: etree._Element) -> str: ..."
  - |
    T = TypeVar("T")
    _Item = TypeVar("_Item")
    def first(kind: type[_Item]) -> _Item: ...
invalid:
  - "def create_server(cache: _Cache, default_source: str | None = None) -> Server: ..."
  - "def load() -> _RawIndex: ..."

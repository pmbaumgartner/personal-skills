id: py-str-kind-field
valid:
  - |
    @dataclass
    class Run:
        status: Status
        name: str
  - |
    def write(path: Path, mode: str) -> None: ...
  - |
    class Settings:
        def __init__(self, mode: str) -> None:
            self.mode: str = mode
  - |
    @dataclass
    class Upload:
        content_type: str
        exception_type: str
        reason: str
invalid:

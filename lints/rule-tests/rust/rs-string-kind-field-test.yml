id: rs-string-kind-field
valid:
  - "struct Run { status: RunStatus, name: String }"
  - "struct Descriptor { provider: &'static str }"
invalid:
  - "pub struct MarkupItem { pub kind: String, pub suggestion_kind: Option<String> }"
  - "struct Run { status: Option<String> }"
  - "enum Event { Started { mode: &'static str } }"

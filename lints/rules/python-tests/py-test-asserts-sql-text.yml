id: py-test-asserts-sql-text
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py"]
message: "Test asserts on generated SQL text."
note: |
  Run the query against an emulator or a fixture table and assert on the rows it returns or changes.
  Typical failure: `assert "MERGE" in sql` or `assert "WHERE x IS NULL" not in query` passes when the predicate is in the wrong CTE or join, and fails when someone reformats the query or renames an alias. Comparing the whole query string fails on every such change and still proves nothing about the rows.
  Variables named `sql`, `query`, `*_sql` or `*_query` are flagged even when the fragment has no SQL keyword. Check that they hold SQL before changing the test.
  Fine when no engine can run the dialect locally and the fragment is the contract, such as a filter that prevents a full table scan. Keep one such assertion, not one per clause.
utils:
  sql-string:
    kind: string
    regex: '\b(SELECT|MERGE|INSERT|UPDATE|DELETE|JOIN|WHERE|GROUP BY|ORDER BY|LIMIT|BEGIN TRANSACTION|CREATE (OR REPLACE )?(TEMP )?TABLE|WITH \w+ AS|QUALIFY|PARTITION BY|UNION ALL|EXISTS)\b'
  full-query:
    any:
      - { kind: string, regex: '\bSELECT\b[\s\S]*\bFROM\b|\b(INSERT INTO|DELETE FROM|MERGE INTO)\b' }
      - { kind: concatenated_string, regex: '\bSELECT\b[\s\S]*\bFROM\b|\b(INSERT INTO|DELETE FROM|MERGE INTO)\b' }
rule:
  any:
    - kind: comparison_operator
      regex: '=='
      inside: { kind: assert_statement, stopBy: end }
      has:
        any:
          - matches: full-query
          - { kind: parenthesized_expression, has: { matches: full-query } }
    - kind: assert_statement
      has:
        stopBy: end
        kind: comparison_operator
        regex: '\bin\b'
        has: { matches: sql-string }
    - kind: call
      all:
        - has: { field: function, regex: '\.assert(Not)?In$' }
        - has:
            field: arguments
            has: { nthChild: 1, matches: sql-string }
    - kind: assert_statement
      has:
        stopBy: end
        all:
          - any:
              - pattern: $FRAGMENT in $QUERY
              - pattern: $FRAGMENT not in $QUERY
          - has: { nthChild: 1, kind: string }
          - has: { nthChild: 2, kind: identifier, regex: '(^|_)(sql|query)$' }

id: py-test-asserts-sql-text
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py"]
message: "Test checks for a SQL fragment in generated query text."
note: |
  Run the query against an emulator or a fixture table and assert on the rows it returns or the rows it changes.
  Typical failure: `assert "MERGE" in sql` or `assert "WHERE x IS NULL" not in query` passes when the predicate is in the wrong CTE or has the wrong join, and fails when someone reformats the query or renames an alias.
  Fine when no engine can run the dialect locally and the fragment is the contract, such as a filter that keeps a query from scanning a whole table; keep one such assertion, not one per clause.
utils:
  sql-string:
    kind: string
    regex: '\b(SELECT|MERGE|INSERT|UPDATE|DELETE|JOIN|WHERE|GROUP BY|ORDER BY|BEGIN TRANSACTION|CREATE (OR REPLACE )?(TEMP )?TABLE|WITH \w+ AS|QUALIFY|PARTITION BY|UNION ALL|EXISTS)\b'
rule:
  any:
    - kind: assert_statement
      has:
        stopBy: end
        kind: comparison_operator
        regex: '\bin\b'
        has: { matches: sql-string }
    - kind: call
      all:
        - has: { field: function, regex: '\.assert(Not)?In$' }
        - has:
            field: arguments
            has: { nthChild: 1, matches: sql-string }

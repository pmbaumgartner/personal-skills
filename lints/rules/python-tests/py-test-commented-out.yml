id: py-test-commented-out
language: python
severity: warning
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "Commented-out test code."
note: |
  Delete it. Version control keeps the history.
  Commented-out tests never run but read like coverage.
rule:
  kind: comment
  # `# assert x == y` is code; `# assert that the cache is cleared` is prose.
  regex: '^#\s*((async\s+)?def test|assert\s+[\w.\[\]()"'']+\s*(==|!=|<=|>=|<|>|\bis\b|\bin\b|\bnot\b|,|$)|@pytest\.)'

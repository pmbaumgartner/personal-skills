id: py-test-exact-float
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "Exact equality with `$F`, a float that's probably computed."
note: |
  Exact float equality breaks on harmless changes in operation order or platform.
  Use pytest.approx (or math.isclose) with the tolerance the behavior specifies.
rule:
  kind: comparison_operator
  regex: '=='
  has:
    kind: float
    pattern: $F
    regex: '\.\d{3,}'
  inside: { kind: assert_statement }

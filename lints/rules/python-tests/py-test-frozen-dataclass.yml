id: py-test-frozen-dataclass
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "Test checks that a frozen dataclass can't be assigned to."
note: |
  This tests the dataclasses module, not the project: `frozen=True` is its guarantee, and the declaration already says it. Delete the test.
rule:
  any:
    - pattern: pytest.raises(FrozenInstanceError $$$)
    - pattern: pytest.raises(dataclasses.FrozenInstanceError $$$)
    - pattern: $S.assertRaises(FrozenInstanceError $$$)

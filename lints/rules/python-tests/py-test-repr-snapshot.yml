id: py-test-repr-snapshot
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "Asserts a whole repr or snapshot."
note: |
  Assert the specified properties.
  A snapshot fails on any incidental change, such as field order, formatting or a new field.
  Fine when the full serialized form is the contract.
rule:
  any:
    - pattern: assert repr($X) == $S
    - pattern: assert $X == snapshot
    - pattern: assert snapshot == $X

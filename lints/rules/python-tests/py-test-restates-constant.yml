id: py-test-restates-constant
language: python
severity: info
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "Asserts that constant `$C` equals a literal."
note: |
  Test behavior that depends on the constant, or delete the assertion.
  It restates the source, so it fails only when someone changes the value on purpose.
utils:
  upper-constant:
    any:
      - { kind: identifier, regex: '^[A-Z][A-Z0-9_]+$', pattern: $C }
      - { kind: attribute, has: { field: attribute, regex: '^[A-Z][A-Z0-9_]+$', pattern: $C } }
  literal:
    any: [ { kind: integer }, { kind: float }, { kind: string }, { kind: "true" }, { kind: "false" }, { kind: list }, { kind: tuple }, { kind: dictionary }, { kind: set } ]
rule:
  kind: assert_statement
  has:
    kind: comparison_operator
    any:
      - all:
          - has: { nthChild: 1, matches: upper-constant }
          - has: { nthChild: 2, matches: literal }
      - all:
          - has: { nthChild: 2, matches: upper-constant }
          - has: { nthChild: 3, matches: literal }

id: py-test-tautology
language: python
severity: warning
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py", "**/conftest.py"]
message: "This assertion can't fail."
note: |
  Compare against an independently known expected value.
rule:
  any:
    - pattern: assert True
    - pattern: assert $A == $A
    - pattern: $S.assertTrue(True)
    - pattern: $S.assertEqual($A, $A)

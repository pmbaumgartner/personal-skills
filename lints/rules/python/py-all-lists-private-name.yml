id: py-all-lists-private-name
language: python
severity: warning
ignores: ["**/tests/**", "**/test/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/scripts/**", "**/benchmarks/**", "**/bench/**", "**/docs/**", "**/examples/**", "**/vendor/**"]
message: "`__all__` exports a private (underscore) name."
note: |
  Either drop the underscore because the name is supported API, or leave it out of `__all__`.
  Tests may import private names from the module directly.
  Typical failure: `__all__` advertises helpers whose underscore says they aren't supported.
rule:
  kind: string
  regex: '^[rbuRBU]?["'']_[A-Za-z0-9]'
  inside:
    stopBy: end
    any:
      - pattern: __all__ = $X
      - pattern: __all__ += $X
      - pattern: "__all__: $T = $X"

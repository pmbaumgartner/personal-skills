id: py-duration-without-unit
language: python
severity: warning
ignores: ["**/tests/**", "**/test/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/scripts/**", "**/benchmarks/**", "**/bench/**", "**/docs/**", "**/examples/**", "**/vendor/**"]
message: "`$NAME` is a number with no unit in its name."
note: |
  Add the unit (`timeout_s`, `delay_ms`, `memory_limit_mib`) or use a unit type such as `timedelta`.
  Typical failure: the Python API takes `timeout` in seconds, the native layer takes `timeout_ms`, and nothing in the names shows the mismatch.
utils:
  unitless-name:
    regex: '(?i)(^|_)(timeout|duration|delay|interval|gap|ttl|period|elapsed|latency|wait|memory|memory_limit|mem_limit)$'
    # An integer gap is usually a count of items, not a time.
    not:
      all:
        - regex: '(?i)(^|_)gap$'
        - not: { inside: { stopBy: end, kind: assignment, any: [ { has: { field: type, regex: '^float' } }, { has: { field: right, kind: float } } ] } }
        - not: { inside: { stopBy: end, any: [ { kind: typed_parameter }, { kind: typed_default_parameter } ], has: { field: type, regex: '^float' } } }
  number-type:
    regex: '^(int|float)(\s*\|\s*None)?$|^Optional\[(int|float)\]$'
  public-function-param:
    inside:
      kind: parameters
      inside:
        kind: function_definition
        has: { field: name, regex: '^([^_]|__init__$)' }
rule:
  any:
    - kind: typed_default_parameter
      all:
        - has: { field: name, pattern: $NAME, matches: unitless-name }
        - has: { field: type, matches: number-type }
        - matches: public-function-param
    - kind: typed_parameter
      all:
        - has: { kind: identifier, pattern: $NAME, matches: unitless-name }
        - has: { field: type, matches: number-type }
        - matches: public-function-param
    # Fields and module constants only; local variables are not API.
    - kind: assignment
      all:
        - has: { field: left, kind: identifier, pattern: $NAME, matches: unitless-name }
        - any:
            - has: { field: type, matches: number-type }
            - has: { field: right, any: [ { kind: integer }, { kind: float } ] }
      inside:
        kind: expression_statement
        inside:
          any:
            - kind: module
            - kind: block
              inside: { kind: class_definition, has: { field: name, regex: '^[^_]' } }

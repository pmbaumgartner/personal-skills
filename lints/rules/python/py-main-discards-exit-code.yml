id: py-main-discards-exit-code
language: python
severity: error
files: ["**/__main__.py"]
message: "`main()` return value is discarded."
note: |
  Write `raise SystemExit(main())`.
  Typical failure: `python -m pkg` prints an error and still exits 0, so scripts and CI treat the failure as success.
rule:
  pattern: main($$$ARGS)
  inside:
    kind: expression_statement
fix: raise SystemExit(main($$$ARGS))

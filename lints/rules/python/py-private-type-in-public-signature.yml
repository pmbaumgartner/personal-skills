id: py-private-type-in-public-signature
language: python
severity: warning
ignores: ["**/tests/**", "**/test/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/scripts/**", "**/benchmarks/**", "**/bench/**", "**/docs/**", "**/examples/**", "**/vendor/**"]
message: "Public function `$NAME` uses a private type in its signature."
note: |
  Callers can't import or name the type they're expected to pass or receive.
  Make the type public, or make the function private.
  Typical failure: `create_server(cache: _Cache)`, which callers must build without being able to import the type.
utils:
  # A project-private class. `module._Name` belongs to another package and is importable
  # (lxml's `etree._Element`); a module-level TypeVar is private by convention.
  private-type-name:
    kind: identifier
    pattern: $T
    regex: '^_[A-Z][a-z]'
    not:
      any:
        - inside: { kind: attribute }
        - inside:
            kind: module
            stopBy: end
            has:
              kind: expression_statement
              has: { kind: assignment, all: [ { has: { field: left, pattern: $T } }, { has: { field: right, regex: '^(typing\.)?(TypeVar|ParamSpec|TypeVarTuple)\(' } } ] }
rule:
  kind: function_definition
  all:
    - has:
        field: name
        pattern: $NAME
        regex: '^[^_]'
    - any:
        - has:
            field: parameters
            has:
              kind: type
              stopBy: end
              has: { matches: private-type-name, stopBy: end }
        - has:
            field: return_type
            has: { matches: private-type-name, stopBy: end }
  not:
    any:
      - inside:
          kind: function_definition
          stopBy: end
      - inside:
          kind: class_definition
          stopBy: end
          has:
            field: name
            regex: '^_'

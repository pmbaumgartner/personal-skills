id: rs-assert-fn-returns-result
language: rust
severity: warning
ignores: ["**/tests/**", "**/benches/**", "**/examples/**", "**/vendor/**", "**/build.rs"]
message: "`$NAME` is named `assert_` but returns a Result."
note: |
  Rename it `check_*` or `validate_*`, or make it panic.
  Typical failure: callers read `assert_valid(x)` as a panic and drop the returned Result.
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $NAME, regex: '^assert_' }
    - has: { field: return_type, regex: '^((std::|core::)?result::)?Result\b|^\w+::Result\b' }

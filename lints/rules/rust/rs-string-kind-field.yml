id: rs-string-kind-field
language: rust
severity: warning
ignores: ["**/tests/**", "**/benches/**", "**/examples/**", "**/vendor/**", "**/build.rs"]
message: "Field `$NAME` stores a kind as a string."
note: |
  Use an enum (with `#[serde(rename_all = "snake_case")]` for the wire format), and move fields that only some kinds have into the variants.
  Typical failure: `kind: String` plus several Options whose meaning depends on it, decoded again with string matches and `unwrap_or("")` in every consumer.
  Fine when the set of values is open, such as a status passed through from another program.
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        pattern: $NAME
        regex: '^(kind|r#type|type_|status|state|mode|backend|phase|stage|variant|action|category)$'
    - has:
        field: type
        regex: '^(Option<)?(String|&(''\w+ )?str|Cow<.*str>)>?$'

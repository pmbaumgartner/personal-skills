id: ts-bool-fn-name
language: tsx
severity: warning
ignores: ["**/test/**", "**/tests/**", "**/e2e/**", "**/*.test.*", "**/*.spec.*", "**/scripts/**", "**/vendor/**", "**/dist/**"]
message: "Exported function `$NAME` returns boolean but isn't named like a question."
note: |
  Use `is`, `has`, `can` or `should`, or a verb such as `contains` or `matches`.
  Typical failure: `hasOption(name)` actually answers "is this flag enabled" and returns false for options that take a value.
  Type guards (`x is T`) and React hooks (`use*`) are exempt.
rule:
  matches: ts-exported-function
  all:
    - has: { field: return_type, regex: '^:\s*(boolean|Promise<boolean>)$' }
    - any:
        - has: { field: name, pattern: $NAME }
        - inside: { kind: variable_declarator, has: { field: name, pattern: $NAME } }
    - not:
        any:
          - has: { field: name, regex: '^(is|has|can|should|was|were|will|did|does|check|validate|use)([A-Z_]|$)|^[a-z]+s([A-Z]|$)|(Is|Are|Has|Have|Can|Should)[A-Z]' }
          - inside:
              kind: variable_declarator
              has: { field: name, regex: '^(is|has|can|should|was|were|will|did|does|check|validate|use)([A-Z_]|$)|^[a-z]+s([A-Z]|$)|(Is|Are|Has|Have|Can|Should)[A-Z]' }

id: ts-string-kind-property
language: tsx
severity: warning
ignores: ["**/test/**", "**/tests/**", "**/e2e/**", "**/*.test.*", "**/*.spec.*", "**/scripts/**", "**/vendor/**", "**/dist/**", "**/examples/**", "**/*.generated.*"]
message: "`$NAME` stores a kind as `string`."
note: |
  Use a union of string literals, and a discriminated union when other properties depend on the kind.
  Typical failure: typed error codes widened to `string` at a worker or HTTP boundary, or results told apart with `"items" in result` instead of a `kind`.
  Fine when the set of values is open, such as a MIME type.
utils:
  kind-name:
    regex: '^(kind|type|status|state|mode|backend|phase|stage|variant|action|category)$'
  string-type:
    regex: '^[?]?:\s*string(\s*\|\s*(undefined|null))*$'
rule:
  any:
    - kind: property_signature
    - kind: public_field_definition
  all:
    - has: { field: name, pattern: $NAME, matches: kind-name }
    - has: { field: type, matches: string-type }

interface:
  display_name: "Evidence-Based Diff Review"
  short_description: "Fast SCC-ranked, graph-assisted change review"
  default_prompt: "Use $evidence-based-diff-review to assess this commit or PR using SCC file deltas, Codebase Memory structural context, and focused source validation."
dependencies:
  tools:
    - type: "mcp"
      value: "scc"
      description: "Pinned file complexity deltas, maintenance hotspots, and focused change coupling"
    - type: "mcp"
      value: "codebase-memory-mcp"
      description: "Changed-symbol context, callers, duplication, coverage, and blast-radius evidence"
policy:
  allow_implicit_invocation: false
